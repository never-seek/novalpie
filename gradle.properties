# Memory on this machine is tight: 16 GB total under heavy background load, and a
# previous build died with a native-memory OOM (arena.cpp) while compiling Kotlin
# in-process inside a 2 GB Gradle daemon -- see hs_err_pid137816.log.
#
# The fix is to stop concentrating everything in one JVM. Dropping
# kotlin.compiler.execution.strategy=in-process lets Kotlin compile in its own
# daemon with its own heap, so neither process needs a large native arena.
# The Kotlin daemon heap is deliberately modest: at 2048m it failed to start on this machine
# ("daemon has terminated unexpectedly on startup attempt #1") and Gradle silently fell back to
# in-process compilation, which is the configuration that OOM'd in the first place.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
